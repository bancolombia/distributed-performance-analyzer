name: Deploy Image
on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish (e.g. 0.7.1). Required when running manually.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=$(echo '${{ github.ref_name }}' | sed 's/^v//')" >> $GITHUB_OUTPUT
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        if: "!github.event.release.prerelease"
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            bancolombia/distributed-performance-analyzer:latest
            bancolombia/distributed-performance-analyzer:${{ steps.version.outputs.tag }}

      - name: Build and push - prerelease
        uses: docker/build-push-action@v4
        if: "github.event.release.prerelease"
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            bancolombia/distributed-performance-analyzer:${{ steps.version.outputs.tag }}